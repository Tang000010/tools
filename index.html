<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>小工具</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--txt:#1c1c1e;--sub:#6e6e73;--line:#e3e3e8}
  @media (prefers-color-scheme: dark){ :root{--bg:#000;--card:#1c1c1e;--txt:#f2f2f7;--sub:#9a9aa0;--line:#2c2c2e} }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--bg); color:var(--txt); min-height:100vh;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
    padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px);
    max-width:560px; margin:0 auto;
  }
  h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--sub);font-size:13.5px;margin-bottom:22px}
  a.card{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:12px;
  }
  a.card:active{transform:scale(.985); opacity:.9}
  .ic{width:52px;height:52px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
      font:700 24px/1 ui-monospace,Menlo,monospace;color:#fff}
  .ic.md{background:#0a84ff}
  .ic.det{background:#34c759}
  .t{flex:1 1 auto;min-width:0}
  .t b{display:block;font-size:16.5px;font-weight:650;margin-bottom:2px}
  .t span{display:block;font-size:13px;color:var(--sub);line-height:1.4}
  .arrow{color:var(--sub);font-size:18px}
  .tip{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:18px;
       background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tip b{color:var(--txt)}
</style>
</head>
<body>
  <h1>小工具</h1>
  <div class="sub">点图标进入，或长按页面用 Safari「添加到主屏幕」</div>

  <a class="card" href="./mdpad.html">
    <div class="ic md">M↓</div>
    <div class="t"><b>Markdown 编辑器</b><span>左代码右预览 · 可拖动分栏 · 快捷工具栏</span></div>
    <div class="arrow">›</div>
  </a>

  <a class="card" href="./det.html">
    <div class="ic det">|A|</div>
    <div class="t"><b>矩阵计算器</b><span>行列式 · 逆矩阵 · 伴随阵 · 矩阵连乘</span></div>
    <div class="arrow">›</div>
  </a>

  <div class="tip">
    <b>单独放到桌面：</b>先点进某个工具，Safari 底部分享 → <b>添加到主屏幕</b>，以后一点就直达，不用经过这一页。<br>
    两个页面都离线可用（本地渲染，不含外部资源）。
  </div>
</body>
</html>
